# Job A: build + crawl ladder. Informational only: it never blocks a merge
# (test step is continue-on-error; do not mark this check as required).
# No network in tests, no secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # libssl-dev = https in src/net (PR #3). The runner image has it today;
      # installing it here keeps that true if the image changes.
      # libboost-dev = spec #1 josh_get_links() (src/team/josh.cc); optional, stub without it.
      # No libcurl: we never link bridges-cxx (the gateway posts to BRIDGES).
      - name: Install deps
        continue-on-error: true   # apt hiccup must not block; the check below warns
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libssl-dev libboost-dev

      - name: Build
        run: make

      # CMake only warns when OpenSSL is missing. Surface it as an annotation
      # (non-blocking) so a TLS-less build never looks green by accident.
      - name: Check https support
        run: |
          grep -q WC_HAVE_OPENSSL build/compile_commands.json \
            && echo "OpenSSL: yes" \
            || echo "::warning::built WITHOUT OpenSSL: https fetches will fail"

      - name: Unit tests (src/net, no network)
        run: build/wc_net_test

      - name: Unit tests (graph + TUI logic + headless views)
        run: |
          build/wc_graph_test
          build/wc_parallel_test
          build/wc_ui_test
          build/wc_query_test
          NO_COLOR=1 build/wc_views_test
          build/wc_logan_shim_test

      - name: Report mode (wc --report, offline fixture)
        run: |
          tests/report/run.sh build/wc
          tests/report/teammate_img.sh build/wc

      - name: BRIDGES JSON golden tests
        continue-on-error: true
        run: build/test_bridges_json tests/bridges/golden

      # Gateway (PR #6): node:test, no deps, no network (fake BRIDGES on 127.0.0.1).
      - name: Gateway tests
        working-directory: gateway
        run: npm test

      - name: Crawl ladder (tests/run.sh)
        continue-on-error: true
        run: tests/run.sh build/wc tests/crawl | tee test-summary.txt

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.txt
